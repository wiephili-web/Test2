name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wlan-logger-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK als Release "apk-latest" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk wlan-logger.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest wlan-logger.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "WLAN Logger – aktueller Build" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7} (Branch ${GITHUB_REF_NAME})."
